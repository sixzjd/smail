<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="smail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。smail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>smail</title>
  <link rel="icon" href="/smail-icon.svg" >
  <!-- iOS 不支持 SVG 的 apple-touch-icon，必须给 PNG，否则添加到主屏后图标是空白 -->
  <link rel="apple-touch-icon" href="/mail-pwa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字体改为非阻塞加载：Google Fonts 在部分网络下不可达，若作为阻塞样式表会让整页长时间白屏 -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  </noscript>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      const root = document.documentElement
      root.setAttribute('class', uiStore.dark ? 'dark' : '');
      const metaTag = document.getElementById('theme-color-meta');
      const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
      metaTag.setAttribute('content', uiStore.dark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#FFFFFF' : '#F1F1F1'));
    }
  </script>
</head>
<style>
  html {
    background: #eee5d8;
  }
  .dark {
    background: #1a1614;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    /* 原先的 --el-bg-color 在迁到 Editorial 后已不存在，会让遮罩背景透明 */
    background: #eee5d8;
  }

  html.dark #loading-first {
    background: #1a1614;
  }

  .loading-tip {
    margin: 8px 0 0;
    font-size: 13px;
    color: rgba(33, 28, 25, 0.6);
  }

  html.dark .loading-tip {
    color: rgba(245, 248, 250, 0.6);
  }

  .loading-retry {
    margin-top: 10px;
    padding: 7px 18px;
    border: 1px solid rgba(217, 84, 62, 0.4);
    border-radius: 999px;
    background: transparent;
    color: #d9543e;
    font-size: 13px;
    cursor: pointer;
  }

  .loading-retry:active {
    background: rgba(217, 84, 62, 0.1);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .loading-image {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(217, 84, 62, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: var(--s-accent, #d9543e);
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(217, 84, 62, 0.45);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(60px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/smail-icon.svg" alt="smail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script>
  // 启动看门狗：App 若在 15s 内仍未挂载，就不再让用户干等，
  // 直接把遮罩换成可重试的提示。（弱网下 init() 卡在无响应的接口上时会出现）
  (function () {
    window.setTimeout(function () {
      var overlay = document.getElementById('loading-first');
      if (!overlay) return; // 已正常移除
      var app = document.getElementById('app');
      if (app && app.children.length > 0) { // App 已挂载，只是遮罩没清掉
        overlay.remove();
        return;
      }
      overlay.innerHTML =
        '<div class="loading-icon">' +
        '<img class="loading-image" src="/smail-icon.svg" alt="smail">' +
        '<p class="loading-tip">加载超时，请检查网络后重试</p>' +
        '<button class="loading-retry" onclick="location.reload()">重新加载</button>' +
        '</div>';
    }, 15000);
  })();
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
