name = "smail"
main = "server/src/index.js"
compatibility_date = "2025-06-04"
keep_vars = false #jwt_secret 已改为 wrangler secret，dashboard 残留的明文变量需随部署清除

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]

[observability]
enabled = true

# 仅 mail.sixzjd.sbs 由本 Worker 服务。
# www / fakegps 子域已由其他 Worker 接管，不要在此声明 ——
# custom domain 无法重复绑定，声明它们只会让每次 wrangler deploy 报错。
[[routes]]
pattern = "mail.sixzjd.sbs"
zone_name = "sixzjd.sbs"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "d3ce23a4-9e69-408a-813a-d734f7ad98c8"

[[kv_namespaces]]
binding = "kv"
id = "cdcd4f3d3b3343eba0299196134d7085"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloudmail"

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
#ai_model = ""
#analysis_cache = false
#orm_log = false
domain = ["sixzjd.sbs"]
admin = "admin@sixzjd.sbs"
#jwt_secret 通过 `wrangler secret put jwt_secret` 配置，勿提交明文密钥

# 第三方邮件客户端（IMAP / SMTP）配置。
# 这里的地址必须和 bridge 进程实际监听的地址一致，改完 `npx wrangler deploy` 生效。
# 两种写法二选一：整块 JSON，或下面的单字段变量。
#
# 方案 A：树莓派 + Tailscale（不用公网 IP，主机名是 tailnet 域名）
#imap_host = "raspberrypi.tailxxxx.ts.net"
#smtp_host = "raspberrypi.tailxxxx.ts.net"
#
# 方案 B：自有域名 + 公网端口（DNS-only / 灰云的 AAAA 记录指向 bridge 所在机器）
# 当前生效：juice 服务器，993 / 465 走隐式 TLS，143 / 25 不对公网开放
imap_host = "imap.sixzjd.sbs"
imap_port = "143"
imap_tls_port = "993"
smtp_host = "imap.sixzjd.sbs"
smtp_port = "587"
smtp_tls_port = "465"
#
# 或者整块写：
#client_config = "{\"enabled\":true,\"imap\":{\"host\":\"imap.sixzjd.sbs\",\"port\":143,\"tlsPort\":993},\"smtp\":{\"host\":\"imap.sixzjd.sbs\",\"port\":587,\"tlsPort\":465}}"

#[build]
#command = "cd web && npm install && npm run build"
